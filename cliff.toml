# git-cliff config — generates CHANGELOG.md from Conventional Commits.
# https://git-cliff.org/docs/configuration
# Pattern taken from tstapler/kibitzer.

[changelog]
header = "# Changelog\n\n"
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}
{% endfor %}\n
"""
trim = true

[bump]
# Pre-1.0: feat bumps minor, fix/perf/refactor bump patch, and a breaking change bumps minor
# (not 1.0.0) until the project deliberately declares 1.0.
features_always_bump_minor = true
breaking_always_bump_major = false

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "v[0-9]*.[0-9]*.[0-9]*"
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^ci", group = "CI" },
  { message = "^chore\\(deps\\)", group = "Dependencies" },
  { message = "^chore", skip = true },
  { message = "^docs", skip = true },
  { message = "^style", skip = true },
  { message = "^test", skip = true },
]
