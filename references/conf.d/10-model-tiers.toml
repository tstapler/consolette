# Example [[model_tiers]]: the same route serves a different model depending on the tier of
# the model the client asked for. See README.md ("Model tiers") for the matching rules.
# Upstream names must be declared in 00-providers.toml; arrays replace across conf.d files.

[[model_tiers]]
name = "haiku"
match = ["claude-haiku"]

[model_tiers.upstreams.openai]
model_family = "gpt-5-mini"

[model_tiers.upstreams.anthropic]
model = "claude-haiku-4-5"

[[model_tiers]]
name = "sonnet"
match = ["claude-sonnet"]

[model_tiers.upstreams.openai]
model_family = "gpt-5"
