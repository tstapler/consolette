[package]
name = "consolette"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Provider-agnostic LLM router: proxies Anthropic/Bedrock/OpenAI-compatible upstreams with fallback, weighted routing, and rate limiting"
repository = "https://github.com/tstapler/consolette"

# Rust 1.74+ lints — set once here instead of per-module boilerplate.
[lints.clippy]
all = "warn"
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"

[lib]
name = "consolette"
path = "src/lib.rs"

[[bin]]
name = "consolette"
path = "src/main.rs"

[[bin]]
name = "mcp-proxy"
path = "src/bin/mcp-proxy/main.rs"

[[bin]]
name = "cmdcrush"
path = "src/bin/cmdcrush/main.rs"

[[bin]]
name = "readme-check"
path = "src/bin/readme-check/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# Bumped from 0.1 (unimplemented stub) to 2.1 to match the feature set the
# ported mcp_gateway.rs / bin/mcp-proxy actually need.
rmcp = { version = "2.1", features = [
    "server",
    "client",
    "transport-io",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rolling-file = "0.2"
figment = { version = "0.10", default-features = false, features = ["toml", "env"] }
toml = "0.8"
glob = "0.3"
http = "1"
async-trait = "0.1"
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
# Pinned at 0.8: 0.9 moved WeightedIndex/thread_rng to rand::distr::weighted /
# rand::rng() (ADR-003).
rand = "0.8"
dashmap = "6"
governor = "0.10"
# Already resolved transitively (tokio); promoted to a direct dep for the
# geteuid() call in the ADR-007 exec-helper permission check.
libc = "0.2"

# --- Feature-module port (Story 6.2) additions below ---
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "timeout"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
aws-sdk-bedrockruntime = "1"
aws-sdk-bedrock = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-smithy-http-client = { version = "1", features = ["rustls-ring"] }
moka = { version = "0.12", features = ["future", "sync"] }
tokio-retry = "0.3"
backoff = { version = "0.4", features = ["tokio"] }
uuid = { version = "1", features = ["v4", "serde"] }
nix = { version = "0.29", features = ["fs", "term"] }
simhash = "0.3"
# gaoya has no 0.2 release on crates.io; lshdedup-core is purpose-built for dedup.
lshdedup-core = "0.1"
tiktoken-rs = "0.5"
regex = "1"
once_cell = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["metrics"] }
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
arc-swap = "1.9.2"

[dev-dependencies]
tempfile = "3"
# Additive feature on top of [dependencies]' tokio — enables `start_paused`/
# `tokio::time::advance` for Epic 2.1's background-refresh-task weak-ref
# exit test (`src/providers/openrouter/mod.rs`), so it can fast-forward
# past `MODEL_LIST_REFRESH_INTERVAL` (5 minutes) without a real sleep.
tokio = { version = "1", features = ["test-util"] }

[profile.dist]
inherits = "release"
lto = "thin"
