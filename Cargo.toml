[package]
name = "consolette"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "consolette — CLI / MCP tool"

# Rust 1.74+ lints — set once here instead of per-module boilerplate.
[lints.clippy]
all = "warn"
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"

[[bin]]
name = "consolette"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rmcp = { version = "0.1", features = ["server"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
figment = { version = "0.10", default-features = false, features = ["toml", "env"] }
toml = "0.8"
glob = "0.3"
http = "1"
async-trait = "0.1"
bytes = "1"
futures-core = "0.3"
# Pinned at 0.8: 0.9 moved WeightedIndex/thread_rng to rand::distr::weighted /
# rand::rng() (ADR-003).
rand = "0.8"
dashmap = "6"
governor = "0.10"
# Already resolved transitively (tokio); promoted to a direct dep for the
# geteuid() call in the ADR-007 exec-helper permission check.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
